name: 功能建议
description: 为 Vagus 提出具体的改进建议。
title: "[功能建议]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题？
      description: 请说明使用场景和遇到的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 请描述你希望得到的结果；实现细节可选。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
