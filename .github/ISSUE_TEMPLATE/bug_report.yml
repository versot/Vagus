name: 问题反馈
description: 报告可复现的 Vagus 问题。
title: "[问题]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 提交前请查看 Provider 文档和平台支持说明，确认问题尚未记录。
  - type: textarea
    id: summary
    attributes:
      label: 问题现象
      description: 请描述实际发生的行为以及预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |-
        1. 打开……
        2. 选择……
        3. 发送……
    validations:
      required: true
  - type: input
    id: vagus-version
    attributes:
      label: Vagus 版本或 commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows x64
        - 其他
    validations:
      required: true
  - type: input
    id: platform-details
    attributes:
      label: 系统版本或其他平台信息
  - type: input
    id: agent
    attributes:
      label: Agent 名称和版本
      description: 例如 Codex CLI、Claude Code 或 OpenCode 的版本。
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 分享前请移除 API 密钥、个人信息和私密会话内容。
