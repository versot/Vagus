name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Run actual Windows WebView2/PTY lifecycle regression
        type: boolean
        default: false
jobs:
  stage-one:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Check changed-file formatting and lint
        env:
          BASE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: npm run style:check
      - run: npm run test:stage-one
      - run: npm run build:app
      - run: npm run bundle:desktop --workspace=@vagus/host
      - name: Check Rust formatting
        working-directory: packages/desktop/src-tauri
        run: cargo fmt --all -- --check
      - run: cargo test --locked --manifest-path packages/desktop/src-tauri/Cargo.toml
      - if: github.event_name == 'workflow_dispatch' && inputs.native
        run: node scripts/native-stage-one.mjs native-stage-one.json
      - if: always() && github.event_name == 'workflow_dispatch' && inputs.native
        uses: actions/upload-artifact@v4
        with:
          name: native-stage-one
          path: native-stage-one.json
